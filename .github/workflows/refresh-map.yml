name: Refresh public heat map
on:
  workflow_dispatch:
  schedule:
    # Retry publication later in the day if a morning source refresh was delayed.
    - cron: '47 12,18 * * *'
  push:
    branches: [main]
    paths: ['update_map.py', '.github/workflows/refresh-map.yml']
permissions:
  contents: read
concurrency:
  group: public-map-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12,<13'
      - name: Download and validate current public map
        run: python update_map.py
      - name: Preserve the daily image and refresh record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/heat-map.png public/updated.json public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update public aggregate map"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Wait for GitHub to list the uploaded map
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_ARTIFACT: pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$MAP_ARTIFACT" --jq '.total_count') && [[ "$count" == 1 ]] && exit 0
            sleep 5
          done
          exit 1
      - name: Publish stable image URL
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
